spring:
  profiles:
    active: local

  cloud:
    aws:
      region:
        static: ap-northeast-2 # 서울 리전
      credentials:
      sqs:
        # AiNotificationSqsListener 의 @SqsListener 는 컨텍스트 기동 중 실제 SQS 에 큐 URL 을 조회한다.
        # 자격증명이 없는 환경(로컬 도커, CI)에서는 이 단계에서 기동 자체가 중단된다.
        # false 로 두면 @SqsListener 를 처리하는 BeanPostProcessor 가 등록되지 않아 폴링만 사라지고,
        # 리스너 빈 자체는 남아 AiTestController 의 mock-sqs-receive 시뮬레이션은 그대로 동작한다.
        # 운영(ECS)은 태스크 역할로 자격증명이 있으므로 기본값 true 를 그대로 쓴다.
        enabled: ${AWS_SQS_ENABLED:true}


  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT}
      lettuce:
        pool:
          max-active: ${REDIS_MAX_POOL}

  # 데이터베이스 연결 설정
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver       # 사용하는 데이터베이스 드라이버
    url: ${DATABASE_URL} # 데이터베이스 URL
    username: ${DATABASE_USERNAME}                               # 데이터베이스 유저 이름
    password: ${DATABASE_PASSWORD}                                 # 데이터베이스 유저의 비밀번호
  # ===================================================================
  # 스키마 마이그레이션 (Flyway)
  # 스키마 변경 권한은 전적으로 Flyway가 가지며, Hibernate는 검증만 수행합니다.
  # ddl-auto=update는 기존 테이블에 유니크 제약을 붙여준다는 보장이 없고,
  # 컬럼 추가 시 기존 행을 백필할 수도 없어 데이터 정합성을 맡길 수 없습니다.
  # ===================================================================
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true   # 이미 테이블이 존재하는 기존 DB에서도 안전하게 시작
    baseline-version: 1         # 기존 DB는 V1을 '적용됨'으로 간주하고 V2부터 실행

  # 스프링 JPA 설정
  jpa:
    hibernate:
      ddl-auto: validate                           # 엔티티와 실제 스키마의 일치 여부만 검증 (스키마 변경은 Flyway 담당)
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect # MySQL 8.x용 Dialect
        format_sql: ${JPA_SHOW_SQL:false}            # 쿼리 로그를 정렬해서 출력한다
        show_sql: ${JPA_SHOW_SQL:false}              # 실행되는 SQL 쿼리를 콘솔에 출력한다. 운영에서는 꺼 둔다.

management:
  endpoints:
    web:
      exposure:
        include: health, metrics
  endpoint:
    health:
      show-details: always # 서킷 브레이커 상세 상태를 보기 위해 필수!
      # 로드밸런서 전용 헬스 그룹.
      # 기본 /actuator/health 는 서킷브레이커·db·redis 인디케이터를 모두 집계하므로,
      # 카카오 API 가 느려져 서킷이 열리는 것만으로 503 이 되어 ALB 가 태스크를 죽인다.
      # 외부 API 장애가 서비스 전체 장애로 번지는 경로라 로드밸런서는 여기를 보지 않게 한다.
      # readinessState 는 '스프링 컨텍스트 기동 완료' 만 반영하므로, 배포 중 트래픽 유입은 막으면서
      # 이미 떠 있는 태스크가 외부 장애로 끌려 내려가지는 않는다.
      probes:
        enabled: true
      group:
        alb:
          include: readinessState
          show-details: never
  health:
    circuitbreakers:
      enabled: true

resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED

        # 1. 윈도우 사이즈와 최소 평가 횟수 스케일업 (민감도 낮추기)
        slidingWindowSize: 100                  # 최근 100번의 호출을 기준으로 평가
        minimumNumberOfCalls: 30                # 최소 30번은 호출되어야 실패율 계산 시작

        # 2. 실패율 및 지연(Slow Call) 차단 기준
        failureRateThreshold: 50                # 실패율 50% 이상 시 OPEN
        slowCallDurationThreshold: 2500ms       # 2.5초 이상 걸리면 '느린 호출'로 간주
        slowCallRateThreshold: 50               # 느린 호출이 50% 이상이어도 OPEN (스레드 고갈 방지)

        # 3. 복구 대기 시간 조정
        waitDurationInOpenState: 15s            # OPEN 후 15초 대기 (빠른 복구 시도)
        permittedNumberOfCallsInHalfOpenState: 5 # HALF_OPEN 상태에서 5번 찔러보기

        # 4. 예외 기록 및 무시 (중요!)
        recordExceptions:
          - java.util.concurrent.TimeoutException
          - java.io.IOException
          - org.springframework.web.reactive.function.client.WebClientRequestException
          - com.serverbe.domain.exception.external.ExternalApiException # 5xx 에러
        ignoreExceptions:
          - com.serverbe.domain.exception.external.ExternalApiClientException # 4xx 에러는 실패율에 포함하지 않음

    instances:
      # 로그인과 지오코딩의 트래픽(TPS)이 다르다면 base-config를 분리하는 것도 좋습니다.
      kakaoUserInfoApi:
        base-config: default
      kakaoTokenApi:
        base-config: default
      googleUserInfoApi:
        base-config: default
      googleTokenApi:
        base-config: default
      kakaoGeocodeApi:
        base-config: default
        # 지오코딩은 트래픽이 더 많을 수 있으므로 윈도우 사이즈를 늘리는 오버라이딩 가능
        # slidingWindowSize: 200

# Swagger 사용 설정
springdoc:
  swagger-ui:
    path: /swagger-ui.html                      # 스웨거 접근 경로
  api-docs:
    path: /v3/api-docs                          # openAPI 접근 경로
  show-actuator: true                           # Spring Actuator의 endpoint까지 보여줄 것인지?
  default-consumes-media-type: application/json # request media type 의 기본 값
  default-produces-media-type: application/json # response media type 의 기본 값
  paths-to-match: # 해당 패턴에 매칭되는 controller만 swagger-ui에 노출한다.
    - /api/v1/**

# ===================================================================
# JWT (JSON Web Token) 관련 설정
# JWTProperties.java 레코드에 바인딩됩니다.
# ===================================================================
# JWT 토큰 설정
jwt:
  secret: ${JWT_SECRET}                    # HS512 알고리즘을 사용할 것이기 때문에 512bit, 즉 64byte 이상의 secret key를 사용해야 한다.
  access-token:
    prefix: "Bearer "
    header: Authorization                  # 액세스 토큰 헤더
    validity-in-minute: 15m                # 액세스 토큰 유효기간 (시간)
  refresh-token:
    cookie: ${JWT_REFRESH_TOKEN_COOKIE}    # 리프레시 토큰 쿠키 키
    expiration-days: 60d                   # 리프레시 토큰 유효기간 (일)
    byte-length: 64
  allowed-clock-skew-seconds: 30
  id-key: id                               # 액세스 토큰에서 사용자 식별자를 가져올 키
  role-key: roles                          # 액세스 토큰에서 권한을 가져올 키

# Redis
redis:
  keys:
    running-art-geo: running_art:locations
  port: ${REDIS_PORT}
  host: ${REDIS_HOST}
  auth:
    prefix: user                      # 레디스 저장에 필요한 키 값 중 접두어
    suffix: rt                        # 레디스 저장에 필요한 키 값 중 접미어
    max-token: 3                      # 최대로 발급 가능한 토큰의 수
  session:
    suffix: session
  blacklist:
    access-token-prefix: "BL:AT"
    refresh-token-prefix: "BL:RT"
  shedlock:
    prefix: "Aetheria-Shedlock"

kakao:
  admin-key: ${KAKAO_ADMIN_KEY}
  client-id: ${KAKAO_CLIENT_ID}
  auth:
    redirect-uri: ${KAKAO_REDIRECT_URI}
    kauth: https://kauth.kakao.com
    kapi: https://kapi.kakao.com
    connect-timeout-millis: 5000
    response-timeout-seconds: 5
    time-out-seconds: 5
  geocoding:
    dapi: https://dapi.kakao.com
    geocode-api: /v2/local/search/address.json

google:
  auth:
    client-id: ${GOOGLE_CLIENT_ID}                                  # 구글 클라우드 콘솔에서 발급받은 클라이언트 ID
    client-secret: ${GOOGLE_CLIENT_SECRET}                          # 구글 클라우드 콘솔에서 발급받은 클라이언트 보안 비밀번호
    redirect-uri: ${GOOGLE_REDIRECT_URI}                            # AuthController의 callback 엔드포인트와 일치해야 함
    oauth-api: https://oauth2.googleapis.com                         # 토큰 발급 및 인증 관련 API 주소
    api: https://www.googleapis.com                                 # 유저 정보 조회 관련 API 주소

art:
  max-radius: 5000.0
  max-result-limit: 5

# 암호화
encryption:
  algorithm: ${ENCRYPTION_ALGORITHM}
  tag-length-bit: 128
  iv-length-byte: 12
  key-algorithm: AES
  active-version: v2
  keys:
    v1: ${ENCRYPTION_SECRET_KEY_V1} # 기존 키
    v2: ${ENCRYPTION_SECRET_KEY_V2} # 새로 발급할 키

# CORS
cors:
  allowed-origins:
    - ${FRONTEND_DOMAIN}          # 프론트엔드 로컬 개발 환경
    - ${DEVELOP_SERVER_DOMAIN}    # 개발 서버 도메인
    - ${PROD_SERVER_DOMAIN}   # 운영 서버 도메인

rate-limit:
  user:
    capacity: ${RATE_LIMIT_USER_CAPACITY} # 사용자가 한 번에 모아둘 수 있는 최대 토큰 개수 - 사용자가 잠시 쉬었다가 요청을 보낼 때, 순간적으로(Burst) 최대 10개까지는 연속 허용
    refill-rate: ${RATE_LIMIT_USER_REFILL_RATE} # 1초마다 채워지는 토큰의 속도입니다. - 장기적으로는 초당 평균 10회의 요청을 처리할 수 있다.
  ip:
    capacity: ${RATE_LIMIT_IP_CAPACITY}
    refill-rate: ${RATE_LIMIT_IP_REFILL_RATE}
  prefix:
    user: "rate:user:"
    ip: "rate:ip:"

aws:
  s3:
    ai-input-bucket: ${AWS_S3_AI_INPUT_BUCKET} # 환경마다 다르므로 인프라(CDK)가 주입한다
    ai-output-bucket: ${AWS_S3_AI_OUTPUT_BUCKET:} # SageMaker 결과물 버킷. 비워두면 Lifecycle 미적용
    lifecycle:
      enabled: ${AWS_S3_LIFECYCLE_ENABLED:false} # true로 켜면 기동 시 아래 정책을 버킷에 자동 적용
      temp-prefixes: # 입력 버킷에서 생성 1일 후 자동 만료(삭제)시킬 임시 경로들
        - "inputs/"
        - "temp/"
      output-prefixes: # 출력 버킷에서 만료시킬 경로들 (삭제 실패분 및 고아 결과물의 최종 방어선)
        - "outputs/"
      expiration-days: 1 # Standard 클래스 유지 (IA는 최소 보관 30일 페널티 있어 미사용)
  sagemaker:
    endpoint-name: ${AWS_SAGEMAKER_ENDPOINT_NAME}          # 인프라(CDK)가 주입한다
  sqs:
    ai-notification-queue-name: ${AWS_SQS_AI_NOTIFICATION_QUEUE_NAME} # 인프라(CDK)가 주입한다



sse:
  timeout: 600000 # 10분 (10 * 60 * 1000 ms)
  channel: "sse-notifications"

# 알림 설정
notification:
  discord:
    webhook-url: ${DISCORD_WEB_HOOK}

task:
  task-timeout-threshold-minutes: 10


# ===================================================================
# 스레드 점유 측정(bench 프로파일) 전용 설정.
# 상용 경로에는 영향이 없다 - BenchController 가 @Profile("bench") 뒤에 있다.
# 값은 docker-compose.bench.yml 이 BENCH_STUB_URL / BENCH_STUB_PATH 로 덮어쓴다.
# 측정 절차는 docs/benchmark/01-thread-occupancy.md 를 보라.
# ===================================================================
bench:
  stub:
    url: ${BENCH_STUB_URL:http://localhost:8090}
    path: ${BENCH_STUB_PATH:/v2/local/search/address.json}
