# Aetheria 백엔드 배포 워크플로우
#
# 인프라 정의는 같은 저장소의 `infra/` 에 있다.
# 거기서 리소스 이름(클러스터/서비스/컨테이너)을 바꾸면 아래 env 블록도 함께 고쳐야 한다.
#
# 사전 준비
#   1. `infra/` 에서 `npx cdk deploy AetheriaCicdStack -c githubOwner=<소유자> -c githubRepo=Server-BE`
#      로 OIDC 배포 역할을 만든다.
#   2. 출력된 DeployRoleArn 을 이 저장소의
#      Settings → Secrets and variables → Actions 에 `AWS_DEPLOY_ROLE_ARN` 으로 등록한다.
#
# 인프라(VPC/RDS/ECS 정의 자체)가 바뀔 때는 이 워크플로우가 아니라 `infra/` 에서
# `cdk deploy` 를 따로 실행한다. 같은 저장소에 있어도 배포 트리거는 분리해 둔다 —
# 아래 paths-ignore 가 그것을 강제한다. 인프라만 고친 커밋으로 앱이 롤링 배포될 이유가 없다.
#
# 현재 상태: 자동 트리거(master 푸시)는 꺼져 있다. Actions 탭에서 수동 실행만 가능하다.

name: Deploy to ECS

on:
  # 자동 배포는 현재 중단 상태다. master 에 푸시해도 ECS 롤링 배포가 돌지 않는다.
  # 다시 켜려면 아래 push 블록의 주석만 풀면 된다.
  # push:
  #   branches: [master]
  #   paths-ignore:
  #     - 'infra/**'
  #     - '**/*.md'
  workflow_dispatch: # 필요할 때만 Actions 탭에서 수동으로 돌린다

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: aetheria-backend
  ECS_CLUSTER: aetheria-cluster
  ECS_SERVICE: aetheria-backend
  ECS_TASK_FAMILY: aetheria-backend
  CONTAINER_NAME: aetheria-backend

permissions:
  id-token: write # OIDC 토큰 발급에 필요. 없으면 AssumeRoleWithWebIdentity 가 실패한다.
  contents: read

# 같은 브랜치에서 배포가 겹치면 뒤엣것만 남긴다. ECS 배포가 서로 밀어내는 것을 막는다.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Test, build, and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # gradlew 는 Windows 에서 커밋되어 git index 모드가 100644 다. 실행 비트를 직접 준다.
      - name: Run tests
        run: |
          chmod +x gradlew
          ./gradlew test --no-daemon

      # 액세스 키 없이 OIDC 로 임시 자격증명을 받는다.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: aetheria-deploy-${{ github.run_id }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # latest 태그는 쓰지 않는다. git sha 로만 태깅해 어떤 커밋이 떠 있는지 항상 추적 가능하게 한다.
      - name: Build and push image
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "uri=$IMAGE" >> "$GITHUB_OUTPUT"

      # 현재 태스크 정의를 받아 이미지 태그만 바꿔 새 리비전을 등록한다.
      # del(.command) 가 중요하다. 인프라를 imageTag 없이 부트스트랩하면 태스크 정의에
      # 플레이스홀더 nginx 를 띄우는 command 가 박혀 있고, .image 만 갈아끼우면
      # Spring 이미지가 그 nginx 명령을 엔트리포인트로 실행하게 된다.
      # (`--force-new-deployment` 는 태스크 정의가 그대로일 때 같은 이미지를 다시 띄우는 명령이라
      #  새 이미지를 반영하지 못한다. 새 리비전 등록이 본체다.)
      - name: Register new task definition revision
        id: taskdef
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
        run: |
          aws ecs describe-task-definition \
            --task-definition "$ECS_TASK_FAMILY" \
            --query taskDefinition > current-task-def.json

          jq --arg IMAGE "$IMAGE_URI" --arg NAME "$CONTAINER_NAME" '
            .containerDefinitions |= map(
                if .name == $NAME then .image = $IMAGE | del(.command) else . end
              )
            | del(
                .taskDefinitionArn,
                .revision,
                .status,
                .requiresAttributes,
                .compatibilities,
                .registeredAt,
                .registeredBy
              )
          ' current-task-def.json > new-task-def.json

          NEW_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://new-task-def.json \
            --query taskDefinition.taskDefinitionArn --output text)
          echo "arn=$NEW_ARN" >> "$GITHUB_OUTPUT"
          echo "등록된 태스크 정의: $NEW_ARN"

      # 롤링 업데이트(minHealthyPercent 100 / maxHealthyPercent 200)로 무중단 교체.
      # 배포 서킷 브레이커가 켜져 있어 새 태스크가 healthy 가 되지 못하면 자동 롤백된다.
      - name: Update ECS service
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "${{ steps.taskdef.outputs.arn }}" \
            --query 'service.deployments[0].[status,taskDefinition]' --output text

      - name: Wait for the service to stabilize
        run: |
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"
          echo "배포 완료: ${{ steps.image.outputs.uri }}"
